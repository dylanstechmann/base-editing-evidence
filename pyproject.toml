[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-editing-evidence"
version = "0.3.0"
description = "Inspectable sequence-change classes, cell-count denominators and functional-evidence gaps."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
baseevidence = "baseevidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
