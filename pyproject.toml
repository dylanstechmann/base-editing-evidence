[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-editing-evidence"
version = "0.1.0"
description = "Inspectable sequence-change classes, cell-count denominators and functional-evidence gaps."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
baseevidence = "baseevidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
